version: "3.9"

services:
  proxy:
    image: nginx:1.27-alpine
    depends_on:
      - next
      - php
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

  next:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3000
    depends_on:
      - db

  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    env_file:
      - .env
    depends_on:
      - db

  db:
    image: mysql:8.4
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MYSQL_DATABASE: ${DB_NAME:-growpal_db}
      MYSQL_USER: ${DB_USERNAME:-growpal}
      MYSQL_PASSWORD: ${DB_PASSWORD:-growpal}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
    command: --default-authentication-plugin=mysql_native_password
    volumes:
      - growpal_mysql_data:/var/lib/mysql

volumes:
  growpal_mysql_data:
